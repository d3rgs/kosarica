<html lang="sl"><head><meta charset="utf-8">

<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#2b2c31"><link rel="apple-touch-icon" href="icon-192.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<style>
:root{--bg:#1c1d20;--s1:#26272b;--s2:#31333a;--ink:#ece6dd;--mut:#a09a90;--o:#ff8a3d;--o2:#ffb067;--ln:#3b3d44;--gr:#8fd6a8;--bad:#ff907c;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
:root[data-theme="light"]{--bg:#efebe5;--s1:#f8f5f0;--s2:#e3ded5;--ink:#27231f;--mut:#756f66;--o:#e0701f;--o2:#ee9650;--ln:#d5cfc5;--gr:#2f8a55;--bad:#c2452f;color-scheme:light}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0;min-height:100%;background:radial-gradient(900px 520px at 12% -8%,#ff8a3d1f,transparent 60%),var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
[hidden]{display:none!important}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:11;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--ln)}
.hd{display:flex;align-items:center;gap:10px;padding:10px 14px;max-width:1000px;margin:auto;flex-wrap:wrap}
.hd h1{font-size:21px;margin:0;flex:1;font-weight:800;min-width:110px}.hd h1 span{color:var(--o)}
.tabs{display:flex;background:var(--s2);border-radius:99px;padding:3px}
.tb{border:0;background:none;color:var(--mut);font:inherit;font-weight:700;padding:7px 14px;border-radius:99px;cursor:pointer}.tb.on{background:var(--o);color:#2a1405}
.ib,.raise{background:var(--s2);border:1px solid var(--ln);color:var(--ink);border-radius:12px;padding:8px 12px;cursor:pointer;font:inherit}
main{max-width:1000px;margin:auto;padding:14px 14px 130px}
.bar{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 14px}
input,select{font:inherit;padding:10px 12px;border:1px solid var(--ln);border-radius:12px;background:var(--s2);color:var(--ink);min-width:0}
#q{flex:1 1 180px}
.chip{border:1px solid var(--ln);background:var(--s2);color:var(--ink);border-radius:99px;padding:8px 14px;font:inherit;font-weight:600;cursor:pointer}.chip.on{background:var(--o);color:#2a1405;border-color:var(--o)}
.mut,small{color:var(--mut)}small{font-size:12px;display:block}
.fr{display:grid;gap:16px;max-width:900px;margin:0 auto}
@media(min-width:760px){.fr{grid-template-columns:1.75fr 1fr;align-items:start}}
.body,.door{position:relative;border-radius:32px;padding:16px;background:linear-gradient(145deg,#4b4d54,#2c2d31 45%,#3b3d43);box-shadow:0 30px 50px -24px #000,inset 0 2px 2px #ffffff22,inset 0 -3px 6px #0006;color:#ece6dd}
.body::after{content:"";position:absolute;right:7px;top:26%;width:7px;height:96px;border-radius:5px;background:linear-gradient(90deg,#9a9ca3,#55575d);box-shadow:0 2px 6px #000a}
.led{display:flex;justify-content:space-between;gap:10px;background:#131416;border-radius:14px;padding:9px 14px;margin:0 8px 12px 0;color:#ff8a3d;font:700 12px ui-monospace,Menlo,monospace;text-shadow:0 0 9px #ff8a3d;box-shadow:inset 0 3px 8px #000}.led b{font-size:15px}
.frz,.int{border-radius:20px;margin-right:8px;box-shadow:inset 0 10px 26px #000b}

.int{padding:12px 12px 6px;background:radial-gradient(120% 70% at 50% 0,#ff8a3d33,transparent 70%),#1a1b1e}
.sf{position:relative;padding:2px 0 16px;margin-bottom:8px}
.sf::after,.frz::after{content:"";position:absolute;left:-4px;right:-4px;bottom:2px;height:8px;border-radius:4px;background:linear-gradient(#b8c4cc55,#ffffff10);box-shadow:0 8px 14px #000a}
h4{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#a09a90;margin:4px 0 6px}
.row{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:flex-end}
.drs{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:6px 0 8px}.drs>div:empty{display:none}
.dw{border-radius:16px 16px 8px 8px;padding:8px;background:linear-gradient(#ffffff12,#ffffff05);border:1px solid #ffffff16;box-shadow:inset 0 -10px 16px #0007,0 8px 12px #0008}
.door .sf::after{height:6px}
.hint{color:#a09a90;font-size:12px;margin:10px 4px 0}
.it{width:88px;background:none;border:0;color:inherit;font:inherit;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;position:relative;padding:4px 0 6px;transition:opacity .2s}
.em{font-size:42px;line-height:1.1;filter:drop-shadow(0 9px 6px #000c);transition:transform .2s}
.it:hover .em,.it:focus-visible .em{transform:translateY(-7px) scale(1.1)}
.it b{font-size:11.5px;font-weight:600;line-height:1.15;text-align:center;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:26px}
.pc{font-style:normal;font-size:11px;font-weight:800;background:#000a;border:1px solid #ffffff22;border-radius:99px;padding:2px 8px;display:flex;align-items:center;gap:5px}.pc u{width:7px;height:7px;border-radius:50%}.pc.q{color:#a09a90}
.it.off .em{opacity:.5;filter:grayscale(.7) drop-shadow(0 9px 6px #000c)}.it.dim{opacity:.25}
.sv{position:absolute;top:0;right:4px;font-style:normal;font-size:10px;font-weight:900;background:var(--o);color:#2a1405;border-radius:99px;padding:1px 6px}
.swing{position:absolute;inset:0;border-radius:32px;background:linear-gradient(145deg,#5a5c63,#34363b);transform-origin:left center;animation:op 1.1s .3s cubic-bezier(.5,0,.2,1) forwards;pointer-events:none;z-index:3;box-shadow:inset 0 2px 2px #fff3}
@keyframes op{from{transform:perspective(1400px) rotateY(0)}to{transform:perspective(1400px) rotateY(-115deg);opacity:0}}
.plan{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.pcard{background:var(--s1);border:1px solid var(--ln);border-top:4px solid var(--c,var(--ln));border-radius:20px;padding:14px}
.pcard h3{margin:0 0 8px;display:flex;align-items:center;gap:8px}.pcard h3 span{margin-left:auto;background:var(--s2);border-radius:99px;padding:1px 10px;font-size:13px}
.pl{width:100%;display:flex;gap:8px;align-items:center;background:none;border:0;border-top:1px solid var(--ln);color:var(--ink);padding:9px 0;font:inherit;cursor:pointer;text-align:left}.pl span{flex:1}
.pl i{font-style:normal;font-size:12px;font-weight:800;color:var(--gr)}.pl em{font-style:normal;font-size:12px;color:var(--mut)}
.fab{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:12;border:0;border-radius:99px;padding:15px 28px;font:inherit;font-weight:800;font-size:16px;color:#2a1405;cursor:pointer;background:linear-gradient(180deg,var(--o2),var(--o));box-shadow:0 14px 28px -8px #ff8a3d99,inset 0 2px 3px #fff6}
#ov{position:fixed;inset:0;z-index:30;background:#0009;overflow:auto;padding:calc(16px + env(safe-area-inset-top,0px)) 14px calc(24px + env(safe-area-inset-bottom,0px))}
.sh{max-width:720px;margin:auto;background:var(--s1);border:1px solid var(--ln);border-radius:26px;padding:20px;animation:up .28s ease-out;box-shadow:0 30px 60px -20px #000}
@keyframes up{from{transform:translateY(30px);opacity:0}}
.sh h2{margin:0;display:flex;align-items:center;gap:12px;font-size:21px}.sh h3{margin:18px 0 4px}
.x{margin-left:auto;border-radius:12px;padding:6px 12px;cursor:pointer;background:var(--s2);border:1px solid var(--ln);color:var(--ink);font-size:15px}
.win-c{border-radius:22px;padding:18px;margin:14px 0;background:linear-gradient(160deg,#ff8a3d26,#ff8a3d08);border:1px solid var(--o);box-shadow:0 0 36px -8px #ff8a3d77}
.bd{display:inline-block;background:var(--o);color:#2a1405;font-weight:900;font-size:11px;letter-spacing:.07em;border-radius:99px;padding:4px 12px;margin-bottom:6px}
.big{font-size:30px;font-weight:900}.wn .sv{position:static;margin-left:6px}.wn{font-weight:800;font-size:17px}
.rw{display:grid;grid-template-columns:78px 1fr auto;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--ln)}
.tr{height:10px;background:var(--s2);border-radius:6px;overflow:hidden}.tr i{display:block;height:100%;border-radius:6px;animation:gw .8s ease-out}@keyframes gw{from{width:0}}
.rw span{text-align:right;font-weight:700;font-size:14px}.rw.win span{color:var(--o2);font-weight:800}.rw.na .tr{background:none;border:1px dashed var(--ln)}
.ch{width:100%;margin-top:14px}.ax{font-size:9px;fill:var(--mut)}
.li{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-top:1px solid var(--ln);font-size:13px}.li button{border:0;background:none;color:var(--bad);cursor:pointer;font-size:15px}
.fg{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:12px 0}
label{font-size:12px;color:var(--mut);display:flex;flex-direction:column;gap:4px}
.drop{display:grid;place-items:center;padding:26px;border-radius:20px;cursor:pointer;font-weight:800;text-align:center;margin:8px 0;border:2px dashed var(--o)}
.pvw{padding:11px 14px;border-radius:14px;margin:6px 0 14px;min-height:22px;background:var(--s2)}
.btn{border:0;border-radius:16px;padding:13px 24px;font:inherit;font-weight:800;color:#2a1405;cursor:pointer;background:linear-gradient(180deg,var(--o2),var(--o));box-shadow:0 10px 20px -8px #ff8a3d88}
#toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:12px;opacity:0;transition:.25s;pointer-events:none;z-index:40}#toast.on{opacity:1}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.swing{display:none}}

:root{--bg:#2b2c31;--s1:#35373d;--s2:#41434b;--ln:#50525b;--ink:#f2ede5;--mut:#b0aaa0}
.em{font-size:50px;filter:grayscale(1) brightness(.6) drop-shadow(0 9px 6px #000c);transition:transform .2s,filter .25s}
.em img{width:50px;height:50px;border-radius:13px;object-fit:cover;display:block}
.it{width:100px;padding:6px 0 8px}
.it b{color:#9d978d}.it:hover b,.it.sel b{color:#fff}
.it:hover .em,.it:focus-visible .em,.it.sel .em{filter:saturate(1.4) brightness(1.08) drop-shadow(0 12px 8px #000d);transform:translateY(-8px) scale(1.15)}
.it.off .em{opacity:.7}.it:hover.off .em,.it.sel.off .em{opacity:1}.it.dim{opacity:.22}
.dt{position:absolute;top:8px;right:20px;width:8px;height:8px;border-radius:50%;box-shadow:0 0 8px #fff6}
.pop{display:none;position:absolute;bottom:calc(100% - 8px);left:50%;transform:translateX(-50%);z-index:8;background:#111214;border:1px solid var(--o);border-radius:14px;padding:7px 13px;white-space:nowrap;flex-direction:column;align-items:center;gap:2px;box-shadow:0 14px 26px #000c,0 0 20px #ff8a3d55;color:#fff;pointer-events:none}
.pop::after{content:"";position:absolute;top:100%;left:50%;margin-left:-6px;border:6px solid transparent;border-top-color:var(--o)}
.it:hover .pop,.it:focus-visible .pop,.it.sel .pop{display:flex}
.pp{font-weight:900;font-size:17px}.pp small{display:inline;font-size:11px;color:#b0aaa0;margin-left:2px}.ps{font-size:11px;font-weight:800}
.bg{display:flex;gap:4px;margin-top:2px}.tg{font-style:normal;font-size:9.5px;font-weight:900;background:var(--o);color:#2a1405;border-radius:99px;padding:1px 7px}.tg.lw{background:#8fd6a8}.tg.dd{background:#ffffff26;color:#fff}
.body{min-height:700px}.int{min-height:470px}.sf{padding:2px 0 24px;margin-bottom:16px}
.chest{max-width:900px;margin:22px auto 0;position:relative}
.lid{height:28px;border-radius:24px 24px 6px 6px;background:linear-gradient(#70737b,#44464c);box-shadow:inset 0 2px 2px #ffffff33,0 5px 12px #0009;position:relative}
.lid::after{content:"";position:absolute;left:50%;top:8px;width:96px;height:9px;margin-left:-48px;border-radius:5px;background:#26272b;box-shadow:inset 0 2px 3px #000}
.cin{margin:0 6px;padding:18px 18px 14px;border-radius:0 0 30px 30px;background:radial-gradient(120% 90% at 50% 0,#9ad0ff2b,transparent 70%),linear-gradient(#2c3238,#1b1f23);box-shadow:inset 0 16px 32px #000c,0 26px 40px -22px #000;border:1px solid #ffffff18;border-top:0;color:#ece6dd}
.cz{position:relative}.cz h4{color:#9ac4ea}
.hi{width:44px;height:44px;border-radius:12px;object-fit:cover}
textarea{font:inherit;padding:10px 12px;border:1px solid var(--ln);border-radius:12px;background:var(--s2);color:var(--ink);width:100%;box-sizing:border-box}
#cam{position:fixed;inset:0;z-index:60;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;color:#fff}#cam video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}#cam>*:not(video){position:relative;z-index:1}.cf{width:min(80vw,320px);height:150px;border:3px solid var(--o);border-radius:18px;box-shadow:0 0 0 100vmax #0007}#cam .x{position:absolute;top:calc(16px + env(safe-area-inset-top,0px));right:16px}
</style></head><body>
<header><div class="hd"><h1>Košarica<span>.</span></h1><nav class="tabs"><button class="tb on" data-v="f" onclick="vw='f';home()">🧊 Hladilnik</button><button class="tb" data-v="a" onclick="vw='a';home()">🔥 Akcije</button><button class="tb" data-v="k" onclick="vw='k';home()">🛒 Kje kupiti</button></nav><button class="ib" onclick="loadPrices(1)" aria-label="Osveži cene">🔄</button><button class="ib" onclick="bk()" aria-label="Varnostna kopija">💾</button><button class="ib" onclick="tpic()" aria-label="Slike izdelkov">🖼</button><button class="ib" onclick="th()" aria-label="Svetli ali temni način">◐</button></div></header>
<main><div id="tools" class="bar"><input id="q" placeholder="Išči živilo …" oninput="home()"><div id="chips" class="bar" style="margin:0"></div></div><div id="view"></div><p id="fresh" class="mut" style="text-align:center;font-size:12px"></p></main>
<button class="fab" onclick="cam()">📷 Skeniraj izdelek</button>
<div id="ov" hidden></div><div id="toast"></div>
<script>

const ST=[["Mercator","#e8756a"],["SPAR","#79c27e"],["Hofer","#6c9bf0"],["Lidl","#eebd3f"]];
const U={g:["kg",.001],kg:["kg",1],ml:["l",.001],l:["l",1],kos:["kos",1],cm:["m",.01],m:["m",1]};
const SH=[["zam","❄️ Zamrzovalna skrinja"],["mle","Mlečno in jajca"],["mes","Meso in ribe"],["pek","Pekovsko in suho"],["sad","Predal · sadje"],["zel","Predal · zelenjava"],["zac","Vrata · začimbe"],["dru","Drugo"]];
const FD=[["Banane","🍌","kg","sad"],["Skuta 0 %","🥣","kg","mle"],["Goveje mleto meso","🥩","kg","mes"],["Drugo mleto meso","🍖","kg","mes"],["Kakav","🍫","kg","pek"],["Ovseni kosmiči","🌾","kg","pek"],["Zamrznjena zelenjava z brokolijem","🥦","kg","zam"],["Mleko 1,5 %","🥛","l","mle"],["Proteinske tortilije","🌯","kg","pek"],["Bučke","🥬","kg","zel"],["Kumare","🥒","kg","zel"],["Maline","🍓","kg","sad"],["Kaki","🍊","kg","sad"],["Provansalske začimbe","🌿","kg","zac"],["Curry","🍛","kg","zac"],["Fino mleta sol","🧂","kg","zac"],["Začimbe za solato","🥗","kg","zac"],["Kajenski poper","🌶️","kg","zac"],["Tuna v lastnem soku (odcejena masa)","🐟","kg","mes"],["Jajca","🥚","kos","mle"]];
// Cene, ki jih je Claude prebral s spletne ponudbe Hoferja: [id, živilo, trgovina, cena, količina, enota, vrsta, datum, vir, opomba]
const SEED=[]; // samostojna različica ne vsebuje vnaprej vpisanih cen
const $=s=>document.querySelector(s),today=()=>new Date().toISOString().slice(0,10),uid=()=>Math.random().toString(36).slice(2,8);
const E=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const eur=n=>n.toLocaleString("sl-SI",{minimumFractionDigits:2,maximumFractionDigits:2})+" €";
const fd=d=>d.split("-").reverse().map(Number).join(". "),age=d=>Math.round((Date.parse(today())-Date.parse(d))/864e5);
const up=x=>x.pr/(x.a*U[x.u][1]),cur=x=>x.vt?x.vt>=today():age(x.d)<=14;
let S,sf=-1,T={},dbref=null,lastRemote="",timer,tt;
function merge(){S.dl=S.dl||[];S.m=S.m||{};S.f.forEach(f=>{if(!f.c){const r=FD.find(z=>z[0]==f.n);f.c=r?r[3]:"dru"}});SEED.forEach(r=>{const f=S.f.find(x=>x.n==r[1]);if(f&&!S.s.some(x=>x.id==r[0])&&!S.dl.includes(r[0]))S.s.push({id:r[0],f:f.id,s:r[2],pr:r[3],a:r[4],u:r[5],k:r[6],d:r[7],src:r[8],nm:r[9]})})}
try{S=JSON.parse(localStorage.getItem("kv4"))}catch(e){}
if(!S||!S.f)S={f:FD.map((r,i)=>({id:"f"+i,n:r[0],e:r[1],b:r[2]})),s:[],m:{},dl:[]};merge();
try{const t=localStorage.getItem("kth");if(t)document.documentElement.dataset.theme=t}catch(e){}
function th(){const d=document.documentElement,l=d.dataset.theme=="light";d.dataset.theme=l?"dark":"light";try{localStorage.setItem("kth",d.dataset.theme)}catch(e){}}
function save(){const j=JSON.stringify(S);try{localStorage.setItem("kv4",j)}catch(e){}if(dbref){clearTimeout(timer);timer=setTimeout(()=>{lastRemote=j;dbref.set({j}).catch(()=>{})},500)}}
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("on");clearTimeout(tt);tt=setTimeout(()=>t.classList.remove("on"),2400)}
function best(id){const m={},st={};S.s.filter(x=>x.f==id).forEach(x=>{if(cur(x)){if(!m[x.s]||up(x)<up(m[x.s]))m[x.s]=x}else if(!st[x.s]||x.d>st[x.s].d)st[x.s]=x});return{a:Object.values(m).sort((a,b)=>up(a)-up(b)),st}}
function ud(f,v){return`<b>${eur(v)}</b>/${f.b}`}

let vw="f",first=1;
const cp=(f,v)=>v,ul=f=>f.b,pk=x=>x.pk||`${x.a.toLocaleString("sl-SI")} ${x.u}`;
let sel=null,PIC=false;try{PIC=localStorage.getItem("kpic")=="1"}catch(e){}
function tpic(){PIC=!PIC;try{localStorage.setItem("kpic",PIC?"1":"0")}catch(e){}toast(PIC?"Slike izdelkov: vklopljeno":"Slike izdelkov: izklopljeno");home()}
const minAll=id=>{const v=S.s.filter(x=>x.f==id).map(up);return v.length?Math.min(...v):0};
const tap=id=>{if(matchMedia("(hover:hover)").matches||sel==id){sel=null;show(id)}else{sel=id;home()}};
function item(f,q){const k=best(f.id).a,b=k[0],mx=k.length?up(k[k.length-1]):1,sv=k.length>1?Math.round((1-up(b)/mx)*100):0,low=b&&S.s.filter(x=>x.f==f.id).length>1&&up(b)<=minAll(f.id)*1.0001,dim=(sf>=0&&!(b&&b.s==sf))||(q&&!f.n.toLowerCase().includes(q));
return`<button class="it${b?"":" off"}${dim?" dim":""}${sel==f.id?" sel":""}" onclick="tap('${f.id}')"><span class="em">${PIC&&f.img?`<img src="${f.img}" alt="">`:f.e}</span><b>${E(f.n.replace(/ \(.*\)/,""))}</b>${b?`<u class="dt" style="background:${ST[b.s][1]}"></u>`:""}<div class="pop">${b?`<span class="pp">${eur(cp(f,up(b)))}<small>/${ul(f)}</small></span><span class="ps" style="color:${ST[b.s][1]}">${ST[b.s][0]}</span><span class="bg">${b.k=="akcija"?'<i class="tg">AKCIJA</i>':""}${low?'<i class="tg lw">REKORD</i>':""}${sv?`<i class="tg dd">−${sv} %</i>`:""}</span>`:'<span class="ps">Ni potrjene cene</span>'}</div></button>`}
function shelf(k,cls){const q=(($("#q")||{}).value||"").toLowerCase(),L=S.f.filter(f=>(f.c||"dru")==k);return L.length||k!="dru"?`<div class="${cls}"><h4>${SH.find(s=>s[0]==k)[1]}</h4><div class="row">${L.map(f=>item(f,q)).join("")}</div></div>`:""}
function plan(){const g=[[],[],[],[]],no=[];S.f.forEach(f=>{const a=best(f.id).a;if(!a.length)no.push(f);else g[a[0].s].push([f,a[0],a.length>1?Math.round((1-up(a[0])/up(a[a.length-1]))*100):0])});

S.f.forEach(f=>{const b=best(f.id).a[0];if(b&&S.s.filter(x=>x.f==f.id).length>1&&up(b)<=minAll(f.id)*1.0001)low.push([f,b])});

function hist(f){const e=S.s.filter(x=>x.f==f.id);if(!e.length)return"";const ds=[...new Set(e.map(x=>x.d))].sort(),ys=e.map(up),a=Math.min(...ys)*.95,b=Math.max(...ys)*1.05,W=320,H=120,X=d=>ds.length>1?44+ds.indexOf(d)*(W-56)/(ds.length-1):W/2,Y=v=>H-18-(v-a)/(b-a||1)*(H-32);
const s=ST.map(([n,c],i)=>{const p=ds.map(d=>{const m=e.filter(x=>x.s==i&&x.d==d).map(up);return m.length?[X(d),Y(Math.min(...m))]:null}).filter(Boolean);return p.length?`<polyline fill="none" stroke="${c}" stroke-width="2.5" points="${p.join(" ")}"/>`+p.map(q=>`<circle cx="${q[0]}" cy="${q[1]}" r="4" fill="${c}"/>`).join(""):""}).join("");
return`<svg viewBox="0 0 ${W} ${H}" class="ch"><text x="2" y="12" class="ax">${eur(b)}</text><text x="2" y="${H-20}" class="ax">${eur(a)}</text><text x="44" y="${H-4}" class="ax">${ds[0].slice(5)}</text><text x="${W-30}" y="${H-4}" class="ax">${ds[ds.length-1].slice(5)}</text>${s}</svg><small>Zgodovina cene na ${f.b}</small>`}

const lg=S.s.filter(x=>x.f==id).sort((x,y)=>y.d.localeCompare(x.d)).slice(0,12).map(x=>`<div class="li"><span><b style="color:${ST[x.s][1]}">${ST[x.s][0]}</b> · ${eur(x.pr)} / ${pk(x)} · ${x.k}<small>${fd(x.d)} · ${E(x.src)}${x.nm?" · "+E(x.nm):""}</small></span><button onclick="del('${x.id}','${id}')" aria-label="Izbriši">✕</button></div>`).join("");
$("#ov").innerHTML=`<div class="sh"><h2>${PIC&&f.img?`<img class="hi" src="${f.img}" alt="">`:`<span style="font-size:36px">${f.e}</span>`}${E(f.n)}<button class="x" onclick="shut()">✕</button></h2>${w?`<div class="win-c"><div class="bd">${ok?"NAJCENEJE DANES":"Najcenejša med preverjenimi ponudbami"}</div><div class="wn"><b style="color:${ST[w.s][1]}">${ST[w.s][0]}</b>${pct?`<em class="sv">−${pct} % proti najdražji</em>`:""}</div><div class="big">${ud(f,up(w))}</div><small>${pk(w)} za ${eur(w.pr)} · ${w.k}${w.nm?" · "+E(w.nm):""}</small><small>Vir: ${E(w.src)} · preverjeno ${fd(w.d)}</small>${w.rp?`<small>Redna cena ${eur(w.rp)} · popust −${Math.round((1-w.pr/w.rp)*100)} %</small>`:""}${w.vt?`<small>Akcija velja do ${fd(w.vt)}</small>`:""}${w.lo?`<small>Najnižja v zadnjih 30 dneh: ${eur(w.lo)}${w.pr<=w.lo?" · to je najnižja":""}</small>`:""}${minAll(id)?`<small>Najnižja zabeležena: ${eur(cp(f,minAll(id)))}/${ul(f)}</small>`:""}</div>`:'<p class="mut">Še ni potrjene aktualne cene. Poskeniraj prvo.</p>'}${w&&!ok?'<small>Oznaka „najcenejše danes“ zahteva vsaj tri trgovine s cenami, starimi največ 7 dni.</small>':""}<div>${rows}</div><p><button class="btn" onclick="scan('${id}')">📷 Dodaj ceno</button></p>${hist(f)}<h3>Zabeležene cene</h3>${lg||'<p class="mut">Brez zapisov.</p>'}</div>`;$("#ov").hidden=false}

$("#ov").innerHTML=`<div class="sh"><h2>Nova cena<button class="x raise" onclick="shut()">✕</button></h2><button class="chip" onclick="scanM()" style="margin-bottom:10px">📄 Letak ali več izdelkov naenkrat</button><p class="mut">1 · V kateri trgovini si?</p><div class="bar">${ST.map((s,i)=>`<button class="chip raise sc${T.st==i?" on":""}" onclick="pick(${i})">${s[0]}</button>`).join("")}</div><p class="mut">2 · Slikaj črtno kodo izdelka (ali embalažo)</p><label class="drop raise" style="color:var(--ink);font-size:16px"><input type="file" accept="image/*" multiple hidden onchange="rd(this.files)">📷 Slikaj ali izberi sliko<small id="rs" style="font-weight:400">Črtna koda določi izdelek, naslednjič ga prepozna sam. Če je v kadru etiketa, se prebere tudi cena.</small></label><p class="mut">3 · Potrdi podatke</p>
<div class="fg"><label>Živilo<select id="tf" onchange="prev()">${o}<option value="">＋ Novo živilo …</option></select></label><label>Izdelek (ime, znamka)<input id="tn" placeholder="npr. Alpsko mleko"></label><label>Cena pakiranja (€)<input id="tp" type="number" step="0.01" min="0" inputmode="decimal" oninput="prev()"></label><label>Količina<input id="ta" type="number" step="any" min="0" inputmode="decimal" oninput="prev()"></label><label>Enota<select id="tu" onchange="prev()"><option>g</option><option>kg</option><option>ml</option><option>l</option><option>kos</option><option>m</option><option>cm</option></select></label><label>Vrsta cene<select id="tk"><option value="redna">redna</option><option value="akcija">akcija</option><option value="klub">klub zvestobe</option></select></label><label>Polica (za novo živilo)<select id="tc">${SH.map(s=>`<option value="${s[0]}">${s[1]}</option>`).join("")}</select></label><label>Črtna koda (EAN)<input id="te" inputmode="numeric" oninput="auto()"></label></div><label style="flex-direction:row;align-items:center;gap:8px;margin-bottom:10px"><input type="checkbox" id="tpi" style="padding:0"> Shrani sliko izdelka (neobvezno)</label><div class="pvw" id="pv"></div><button class="btn" onclick="saveS()">Shrani ceno</button></div>`;$("#ov").hidden=false;prev()}
function pick(i){T.st=i;S.last=i;document.querySelectorAll(".sc").forEach((b,j)=>b.classList.toggle("on",j==i))}
function auto(){const f=S.m[$("#te").value.replace(/\D/g,"")];if(f)$("#tf").value=f}
function prev(){const f=S.f.find(x=>x.id==$("#tf").value),pr=+$("#tp").value,a=+$("#ta").value,u=$("#tu").value,v=$("#pv");if(!(pr>0&&a>0)){v.textContent="Vnesi ceno in količino, da vidiš ceno na enoto.";return}const p=f||{b:U[u][0],n:""};v.innerHTML=f&&U[u][0]!=f.b?"⚠ Enota ne ustreza živilu (meri se v "+f.b+").":ud(p,pr/(a*U[u][1]))}
const PR=e=>`Na sliki(ah) je živilski izdelek v trgovini (embalaža, črtna koda ali cenovna etiketa na polici). Preberi samo, kar je jasno vidno; česar ne vidiš, vrni null. Ne ugibaj cen. Vrni SAMO JSON: {"name":string|null,"brand":string|null,"ean":string|null,"amount":number|null,"unit":"g"|"kg"|"ml"|"l"|"kos"|null,"price":number|null,"unitPrice":number|null,"unitPriceUnit":"kg"|"l"|"kos"|null,"kind":"redna"|"akcija"|"klub"|null,"store":"Mercator"|"SPAR"|"Hofer"|"Lidl"|null,"food":string|null}. "price" je cena pakiranja v €, "amount" neto količina pakiranja (pri tuni odcejena masa, če je navedena), "food" izberi iz seznama ali null: ${S.f.map(f=>f.n).join("; ")}.${e?" Črtna koda, prebrana s skenerjem: "+e+".":""}`;
async function rd(files){const rs=$("#rs");rs.textContent="Berem sliko …";const im=[];let ean="";
for(const f of files){const bm=await createImageBitmap(f).catch(()=>null);if(!bm)continue;if(window.BarcodeDetector&&!ean){try{const r=await new BarcodeDetector({formats:["ean_13","ean_8","upc_a"]}).detect(bm);if(r[0])ean=r[0].rawValue}catch(e){}}
const k=Math.min(1,1280/Math.max(bm.width,bm.height)),c=document.createElement("canvas");c.width=bm.width*k;c.height=bm.height*k;c.getContext("2d").drawImage(bm,0,0,c.width,c.height);if(!T.thumb){const c2=document.createElement("canvas"),k2=72/Math.max(bm.width,bm.height);c2.width=bm.width*k2;c2.height=bm.height*k2;c2.getContext("2d").drawImage(bm,0,0,c2.width,c2.height);T.thumb=c2.toDataURL("image/jpeg",.6)}im.push(await new Promise(r=>c.toBlob(r,"image/jpeg",.82)))}
let d={};try{const sm=window.claude&&await claude.use("sample");if(!sm)throw{code:"ni_na_voljo"};d=await sm.json(PR(ean),{images:im,cache:false})||{};T.ph=1}catch(e){rs.textContent="Slike ni bilo mogoče prebrati ("+(e.code||"napaka")+"). Izpolni ročno.";if(ean)$("#te").value=ean;auto();return}
const set=(i,v)=>{if(v!=null&&v!=="")$("#"+i).value=v};ean=ean||String(d.ean||"").replace(/\D/g,"");set("te",ean);set("tn",[d.brand,d.name].filter(Boolean).join(" "));set("tp",d.price);set("ta",d.amount);if(U[d.unit])$("#tu").value=d.unit;if(["redna","akcija","klub"].includes(d.kind))$("#tk").value=d.kind;
if(!d.price&&d.unitPrice&&U[d.unitPriceUnit]){set("tp",d.unitPrice);set("ta",1);$("#tu").value=d.unitPriceUnit}
const i=ST.findIndex(s=>s[0].toLowerCase()==String(d.store).toLowerCase());if(i>=0&&T.st<0)pick(i);
const g=S.m[ean]||(S.f.find(f=>f.n==d.food)||{}).id;if(g)$("#tf").value=g;
rs.textContent=(S.m[ean]?"Izdelek prepoznan po črtni kodi. ":"")+"Preveri podatke in vpiši ceno, če je ni.";prev();if(!$("#tp").value)$("#tp").focus()}
function saveS(){const fid=$("#tf").value,pr=+$("#tp").value,a=+$("#ta").value,u=$("#tu").value,nm=$("#tn").value.trim(),e=$("#te").value.replace(/\D/g,"");
if(T.st<0)return toast("Izberi trgovino");if(!(pr>0&&a>0))return toast("Vnesi ceno in količino");
let f=S.f.find(x=>x.id==fid);if(!f){if(!nm)return toast("Vpiši ime novega živila");f={id:"f"+uid(),n:nm,e:"🛍️",b:U[u][0],c:$("#tc").value};S.f.push(f)}
if($("#tpi").checked&&T.thumb)f.img=T.thumb;if(U[u][0]!=f.b)return toast("Enota ne ustreza živilu (meri se v "+f.b+")");
S.s.push({id:uid(),f:f.id,s:T.st,pr,a,u,k:$("#tk").value,d:today(),src:T.ph?"skeniranje":"ročni vnos",nm,ean:e||undefined});if(e)S.m[e]=f.id;save();home();show(f.id);toast("Cena shranjena")}

function scanM(){T={st:S.last??-1,rows:[]};$("#ov").innerHTML=`<div class="sh"><h2>Več izdelkov naenkrat<button class="x" onclick="shut()">✕</button></h2><p class="mut">Zaslonska slika letaka ali spletne trgovine, ali prilepljeno besedilo strani. Claude prebere izdelke, ti izbereš, kaj se shrani. Mercator prikaže tudi najnižjo ceno v 30 dneh (PC30), ki jo aplikacija uporabi za rekorde.</p><p class="mut">1 · Trgovina</p><div class="bar">${ST.map((s,i)=>`<button class="chip sc${T.st==i?" on":""}" onclick="pick(${i})">${s[0]}</button>`).join("")}</div><label class="drop"><input type="file" accept="image/*" multiple hidden onchange="rdM(this.files)">📷 Izberi slike<small id="rs" style="font-weight:400"></small></label><p class="mut">ali prilepi besedilo strani (Ctrl+A, Ctrl+C v spletni trgovini):</p><textarea id="pt" rows="4"></textarea><p><button class="chip" onclick="rdT()">Preberi besedilo</button></p><p class="mut">ali uvozi JSON samodejnega zbiralnika cen (prices.json):</p><textarea id="pj" rows="3" placeholder='{"offers":[{"store":"Mercator","food":"Banane","ean":"…","price":1.49,"amount":1,"unit":"kg"}]}'></textarea><p><button class="chip" onclick="impJ()">Uvozi JSON</button></p><div id="rw"></div><p><button class="btn" id="sm" hidden onclick="saveM()">Shrani izbrane</button></p></div>`;$("#ov").hidden=false}
const PRM=()=>`Na slikah ali v besedilu je letak, katalog ali spletna trgovina z živili. Preberi vse izdelke z jasno vidno ceno; česar ne vidiš, vrni null. Ne ugibaj. Vrni SAMO JSON: {"items":[{"name":string,"brand":string|null,"amount":number|null,"unit":"g"|"kg"|"ml"|"l"|"kos"|null,"price":number|null,"unitPrice":number|null,"unitPriceUnit":"kg"|"l"|"kos"|null,"rp":number|null,"pc30":number|null,"kind":"redna"|"akcija"|"klub"|null,"validTo":"YYYY-MM-DD"|null,"food":string|null}]}. "price" je trenutna cena pakiranja v €, "rp" prečrtana redna cena pred popustom, "pc30" najnižja cena v zadnjih 30 dneh (oznaka PC30). validTo vrni null, če je datum 1970-01-01. "food" izberi iz seznama samo, če je izdelek ustrezen (npr. banane → Banane), sicer null: ${S.f.map(f=>f.n).join("; ")}.`;
async function ask(p,o){const rs=$("#rs");rs.textContent="Berem …";try{const sm=window.claude&&await claude.use("sample");if(!sm)throw{code:"ni_na_voljo"};return await sm.json(p,o)}catch(e){rs.textContent="Branje ni uspelo ("+(e.code||"napaka")+").";return null}}
async function rdM(files){const im=[];for(const f of files){const bm=await createImageBitmap(f).catch(()=>null);if(!bm)continue;const k=Math.min(1,1600/Math.max(bm.width,bm.height)),c=document.createElement("canvas");c.width=bm.width*k;c.height=bm.height*k;c.getContext("2d").drawImage(bm,0,0,c.width,c.height);im.push(await new Promise(r=>c.toBlob(r,"image/jpeg",.85)))}const d=await ask(PRM(),{images:im,cache:false});if(d)fin(d)}
async function rdT(){const t=$("#pt").value.trim().slice(0,15000);if(!t)return;const d=await ask(PRM()+"\n\nBesedilo strani:\n"+t,{cache:false});if(d)fin(d)}
function fin(d){T.rows=((d&&d.items)||[]).filter(r=>r.name&&r.price>0).map(r=>{let a=r.amount,u=r.unit,p=+r.price;if(!(a>0&&U[u])){if(r.unitPrice>0&&U[r.unitPriceUnit]){p=+r.unitPrice;a=1;u=r.unitPriceUnit}else return null}let k=["redna","akcija","klub"].includes(r.kind)?r.kind:"redna";if(r.rp>p*1.01&&k=="redna")k="akcija";return{n:[r.brand,r.name].filter(Boolean).join(" "),p,a:+a,u,k,rp:+r.rp||0,lo:+r.pc30||0,vt:r.validTo&&r.validTo>"2000"?r.validTo:"",f:(S.f.find(x=>x.n==r.food)||{}).id||""}}).filter(Boolean);
$("#rs").textContent=T.rows.length?"Prebranih izdelkov: "+T.rows.length+". Preveri in označi.":"Ni prebranih izdelkov s ceno.";
$("#rw").innerHTML=T.rows.map((r,i)=>`<div class="li" style="align-items:center"><input type="checkbox" id="mc${i}"${r.f?" checked":""}><span style="flex:1"><b>${E(r.n)}</b><small>${eur(r.p)} / ${r.a.toLocaleString("sl-SI")} ${r.u} · ${r.k}${r.rp?" · redna "+eur(r.rp):""}${r.vt?" · do "+fd(r.vt):""}</small></span><select id="mf${i}">${S.f.map(x=>`<option value="${x.id}"${x.id==r.f?" selected":""}>${E(x.n)}</option>`).join("")}<option value=""${r.f?"":" selected"}>＋ novo</option></select></div>`).join("");$("#sm").hidden=!T.rows.length}
const mt=(x,w)=>x.ean&&w.ean?(x.ean==w.ean?"identičen izdelek":"primerljiva alternativa"):"nepotrjeno ujemanje";
function impJ(){let d;try{d=JSON.parse($("#pj").value)}catch(e){return toast("Neveljaven JSON")}const r=impO(Array.isArray(d)?d:d.offers||[]);save();home();toast("Uvoženih cen: "+r[0]+(r[1]?" · preskočenih: "+r[1]:""))}
function impO(L){let n=0,sk=0;
